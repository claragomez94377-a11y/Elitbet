<!-- =========================================================
     LOADING
     ========================================================= -->

<div id="loading">

  <div class="spinner"></div>

  <div class="loading-text">
    Cargando chat...
  </div>

</div>


<!-- =========================================================
     CHATWEB
     ========================================================= -->

<div id="kommoChatFrame"></div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const loading =
  document.getElementById(
    'loading'
  );


let ready = false;

let visitorSaved = false;


/* =========================================================
   WORKER CLOUDFLARE
   ========================================================= */

const ATTRIBUTION_WORKER =
  'https://nameless-truth-5bae.claragomez94377.workers.dev/';


/* =========================================================
   COOKIE
   ========================================================= */

function getCookie(name){

  const prefix =
    name + '=';

  const cookies =
    document.cookie.split(';');


  for(
    let i = 0;
    i < cookies.length;
    i++
  ){

    const cookie =
      cookies[i].trim();


    if(
      cookie.indexOf(prefix) === 0
    ){

      return decodeURIComponent(
        cookie.substring(
          prefix.length
        )
      );

    }

  }


  return null;

}


/* =========================================================
   FBP
   ========================================================= */

function getFBP(){

  return getCookie('_fbp');

}


/* =========================================================
   FBC
   ========================================================= */

function getFBC(){

  let fbc =
    getCookie('_fbc');


  if(fbc){

    return fbc;

  }


  const params =
    new URLSearchParams(
      window.location.search
    );


  const fbclid =
    params.get('fbclid');


  if(!fbclid){

    return null;

  }


  fbc =
    'fb.1.' +
    Date.now() +
    '.' +
    fbclid;


  try{

    document.cookie =
      '_fbc=' +
      encodeURIComponent(fbc) +
      '; path=/; max-age=7776000; SameSite=Lax';

  }catch(error){

    console.log(
      '⚠️ No se pudo guardar _fbc'
    );

  }


  return fbc;

}


/* =========================================================
   ENVIAR VISITANTE AL WORKER
   ========================================================= */

async function sendVisitorDataToWorker(){

  if(visitorSaved){

    return;

  }


  try{

    const fbp =
      getFBP();


    const fbc =
      getFBC();


    console.log(
      '========================================'
    );


    console.log(
      '🔎 ENVIANDO VISITANTE AL WORKER'
    );


    console.log(
      'FBP:',
      fbp || 'NO DISPONIBLE'
    );


    console.log(
      'FBC:',
      fbc || 'NO DISPONIBLE'
    );


    if(
      !fbp &&
      !fbc
    ){

      console.log(
        '⚠️ TODAVÍA NO HAY FBP/FBC'
      );

      return;

    }


    const response =
      await fetch(
        ATTRIBUTION_WORKER + 'visitor',
        {

          method:
            'POST',

          headers:{

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              fbp:
                fbp || null,

              fbc:
                fbc || null

            })

        }
      );


    const result =
      await response.text();


    console.log(
      '📡 WORKER /visitor STATUS:',
      response.status
    );


    console.log(
      '📡 WORKER /visitor RESPONSE:',
      result
    );


    if(response.ok){

      visitorSaved = true;


      console.log(
        '✅ VISITANTE GUARDADO EN CLOUDFLARE'
      );

    }


  }catch(error){

    console.error(
      '❌ ERROR ENVIANDO VISITANTE:',
      error
    );

  }

}


/* =========================================================
   INTENTAR GUARDAR VISITANTE
   ========================================================= */

setTimeout(

  function(){

    sendVisitorDataToWorker();

  },

  1200

);


/* =========================================================
   ENVIAR FBP/FBC A KOMMO
   ========================================================= */

function sendMetaAttributionToKommo(){

  try{

    if(
      typeof crm_plugin ===
      'undefined'
    ){

      console.log(
        '⚠️ crm_plugin todavía no disponible'
      );

      return;

    }


    const fbp =
      getFBP();


    const fbc =
      getFBC();


    console.log(
      'META FBP:',
      fbp || 'NO DISPONIBLE'
    );


    console.log(
      'META FBC:',
      fbc || 'NO DISPONIBLE'
    );


    const customFields = [];


    if(fbp){

      customFields.push({

        id:152722,

        values:[

          {
            value:fbp
          }

        ]

      });

    }


    if(fbc){

      customFields.push({

        id:152724,

        values:[

          {
            value:fbc
          }

        ]

      });

    }


    if(
      customFields.length === 0
    ){

      console.log(
        '⚠️ NO HAY FBP/FBC'
      );

      return;

    }


    crm_plugin.setMeta({

      contact:{

        custom_fields:
          customFields

      }

    });


    console.log(
      '✅ FBP/FBC ENVIADOS A KOMMO'
    );


  }catch(error){

    console.error(
      '❌ ERROR ENVIANDO FBP/FBC:',
      error
    );

  }

}


/* =========================================================
   ABRIR CHAT AUTOMÁTICAMENTE
   ========================================================= */

function openChatAutomatically(){

  try{

    frame.classList.add(
      'is-open'
    );


    crmPlugin(
      'runChatShow'
    );


    console.log(
      '✅ CHATWEB KOMMO ABIERTO AUTOMÁTICAMENTE'
    );


    setTimeout(

      function(){

        loading.style.display =
          'none';

      },

      350

    );


  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO CHAT:',
      error
    );


    loading.innerHTML =
      '<div class="loading-text">Cargando chat...</div>';

  }

}


/* =========================================================
   ESPERAR KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      150
    );

    return;

  }


  console.log(
    '⏳ ESPERANDO CHATWEB KOMMO...'
  );


  crmPlugin(

    'onChatReady',

    async function(){

      ready = true;


      console.log(
        '✅ CHATWEB KOMMO LISTO'
      );


      /* =====================================================
         GUARDAR ATRIBUCIÓN
         ===================================================== */

      await sendVisitorDataToWorker();


      /* =====================================================
         GUARDAR FBP/FBC EN KOMMO
         ===================================================== */

      sendMetaAttributionToKommo();


      /* =====================================================
         ABRIR AUTOMÁTICAMENTE
         ===================================================== */

      setTimeout(

        function(){

          openChatAutomatically();

        },

        300

      );

    }

  );

}


/* =========================================================
   INICIAR
   ========================================================= */

bind();

</script>
