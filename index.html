  *{

  .wrapper{

  .hero{

  .hero img{

    object-fit:cover;
    object-position:center top;

  }

  /* Barra inferior compacta */
  .cta-bar{
    background:linear-gradient(180deg,#120a22 0%,#0b0618 100%);
    padding:14px 18px 20px;
    border-top:1px solid rgba(155,92,255,0.35);
    flex-shrink:0;
  }

  .ops{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:13px;
    color:#c084fc;
    font-weight:600;
    margin-bottom:12px;
  }

  .ops::before{
    content:'';
    width:8px;
    height:8px;
    background:#a855f7;
    border-radius:50%;
    animation:pulseDot 1.4s infinite;
  }

  .wa-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:linear-gradient(135deg,#a855f7 0%,#7c3aed 100%);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px 20px;
    font-size:16px;
    font-weight:800;
    width:100%;
    cursor:pointer;
    box-shadow:0 8px 28px rgba(168,85,247,0.45);
    animation:shake 2.8s ease-in-out infinite,glowBtn 2s ease-in-out infinite;
  }

  .wa-btn:active{
    transform:scale(0.97);
    animation:none;
  }

  .wa-btn svg{
    width:22px;
    height:22px;
    fill:#fff;
  }

  .footer-text{
    text-align:center;
    margin-top:10px;
    font-size:11px;
    color:#888;
  }

  @keyframes shake{
    0%,100%{
      transform:translateX(0);
    }

    8%{
      transform:translateX(-3px);
    }

    16%{
      transform:translateX(3px);
    }

    24%{
      transform:translateX(-2px);
    }

    32%{
      transform:translateX(2px);
    }

    40%{
      transform:translateX(0);
    }
  }

  @keyframes glowBtn{
    0%,100%{
      box-shadow:0 8px 28px rgba(168,85,247,0.45);
    }

    50%{
      box-shadow:0 8px 36px rgba(168,85,247,0.7);
    }
  }

  @keyframes pulseDot{
    0%,100%{
      opacity:1;
      transform:scale(1);
    }

    50%{
      opacity:0.45;
      transform:scale(0.85);
    }
  }

  #kommoChatFrame{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.96);
    visibility:hidden;
    opacity:0;
    transition:0.3s;
    z-index:9999;
  }

  #kommoChatFrame.is-open{
    visibility:visible;
    opacity:1;
  }

  #kommoChatFrame iframe{

    height:100% !important;
    border:0 !important;

    z-index:10000;

    justify-content:center;

  ✕
</button>

<script>

const frame =
  document.getElementById('kommoChatFrame');

const closeBtn =
  document.getElementById('kommoClose');

const openBtn =
  document.getElementById('openChatBtn');

let ready = false;


// =========================================================
// ABRIR CHAT REAL DE KOMMO
// =========================================================

function openReal(){

  frame.classList.add('is-open');

  closeBtn.classList.add('is-open');

  try{

    crmPlugin('runChatShow');

    console.log(
      '✅ ChatWeb Kommo abierto'
    );

  }catch(e){

    console.log(
      '❌ Error abriendo ChatWeb:',
      e
    );

  }

}


// =========================================================
// ABRIR CHAT MANUALMENTE
// =========================================================

function openChat(){

  if(ready){

    openReal();

  }

}


// =========================================================
// CERRAR CHAT
// =========================================================

function closeChat(){

  frame.classList.remove('is-open');

  closeBtn.classList.remove('is-open');

  try{

    crmPlugin('runChatHide');

  }catch(e){}

}


// =========================================================
// ESPERAR A QUE KOMMO ESTÉ LISTO
// =========================================================

function bind(){

  if(typeof crmPlugin !== 'function'){

    setTimeout(
      bind,
      150
    );

    return;

  }

  crmPlugin(
    'onChatReady',
    function(){

      ready = true;

      console.log(
        '✅ Kommo ChatWeb listo'
      );

      // ===================================================
      // ABRIR AUTOMÁTICAMENTE AL ENTRAR A LA PÁGINA
      // ===================================================

      setTimeout(
        function(){

          openReal();

        },
        300
      );

    }
  );

}


// =========================================================
// EVENTOS DE LOS BOTONES
// =========================================================

openBtn.addEventListener(
  'click',
  openChat
);

closeBtn.addEventListener(
  'click',
  closeChat
);


// =========================================================
// INICIAR
// =========================================================

bind();

</script>
